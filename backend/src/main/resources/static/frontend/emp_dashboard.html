<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .container-custom {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            padding: 40px 30px;
        }
        .balance-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            margin-top: 20px;
        }
        .balance-box .label {
            font-size: 1rem;
            font-weight: 500;
            opacity: 0.9;
        }
        .balance-box .amount {
            font-size: 2.8rem;
            font-weight: 700;
            margin-top: 8px;
        }
        .button-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 25px;
        }
        .action-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .action-btn:hover {
            background-color: #45a049;
            transform: scale(1.02);
        }
        .heading {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
        }
        .msg-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            min-height: 80px;
            color: #1e293b;
            font-size: 1rem;
        }
        .read-btn {
            background: #f97316;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
        }
        .read-btn:hover {
            background: #ea580c;
        }
        .noti-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }
    </style> 
</head>
<body>
    <div class="container-custom">
        
        <div class="balance-box"> 
            <div class="amount" id="bal">Dashboard</div>
        </div>

        <div class="msg-box" id="notibox">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 10px;">
                <button class="read-btn" onclick="markAsRead()">Mark all as read</button>
            </div>
            <div id="notiList">
                <!-- Messages will appear here -->
            </div>
        </div>

        <div class="button-container">
            <button class="action-btn" onclick="fetchallnoti()">Notifications</button>
            <button class="action-btn" onclick="insigts()">Insights</button>
            <button class="action-btn" onclick="getusers()">Users</button>
            <button class="action-btn" onclick="gettransactions()">Transactions</button>
            <button class="action-btn" onclick="getemployees()">Employees</button>
            <button class="action-btn" onclick="sendmsg()">Send Msg</button>
            <button class="action-btn" onclick="tempend()">temp endpoint</button>
        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/emp_dashboard.js"></script>
</body>
</html>
