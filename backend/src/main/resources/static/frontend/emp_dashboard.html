<!DOCTYPE html>
<html>
<head>
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .container-custom {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #e2e8f0;
            padding: 40px 30px;
        }
        .balance-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            margin-top: 20px;
        }
        .balance-box .label {
            font-size: 1rem;
            font-weight: 500;
            opacity: 0.9;
        }
        .balance-box .amount {
            font-size: 2.8rem;
            font-weight: 700;
            margin-top: 8px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            margin-top: 25px;
        }
        .action-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: background 0.3s;
        }
        .action-btn:hover {
            background-color: #45a049;
            transform: scale(1.02);
        }
        .heading {
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e293b;
        }
    </style>
</head>
<body>
    <div class="container-custom">
        
        <div class="balance-box">
            <div class="amount" id="bal">Dashboard</div>
        </div>
        <div class="button-container">
            <button class="action-btn" onclick="insigts()">Insights</button>
        </div>
    </div>

    <script src="../js/toast.js"></script>
    <script src="../js/emp_dashboard.js"></script>
</body>
</html>
