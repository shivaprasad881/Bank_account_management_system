<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .chat-container {
            max-width: 600px;
            width: 100%;
            margin: 20px auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
            overflow: hidden;
        }
        .chat-box {
            padding: 20px;
            height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }
        .msg-row.me {
            align-self: flex-end;
            align-items: flex-end;
        }
        .msg-row.other {
            align-self: flex-start;
            align-items: flex-start;
        }
        .msg-name {
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 3px;
        }
        .msg-bubble {
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .msg-row.me .msg-bubble {
            background: #f97316;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .msg-row.other .msg-bubble {
            background: #f1f5f9;
            color: #1e293b;
            border-bottom-left-radius: 4px;
        }
        .msg-time {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-top: 4px;
        }
        .chat-input-bar {
            display: flex;
            gap: 10px;
            padding: 15px 20px;
            border-top: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .chat-input-bar input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 20px;
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input-bar input:focus {
            border-color: #f97316;
        }
        .chat-input-bar button {
            background: #f97316;
            color: white;
            border: none;
            padding: 10px 22px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
        }
        .chat-input-bar button:hover {
            background: #ea580c;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="heading">
            <h1>Chat</h1>
        </div>
        <div class="chat-box" id="chatBox">
            <!-- Messages will appear here -->
        </div>

        <div class="chat-input-bar">
            <input type="text" id="chatInput" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/chat.js"></script>

</body>
</html>
