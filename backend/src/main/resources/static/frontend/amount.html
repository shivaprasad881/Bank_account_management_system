<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Container</title> 
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="heading">
            <h1>Money Transfer</h1>
        </div>
        <div class="content">

            <div class="input-group" id="targetGroup" style="display: none; flex-direction: row; align-items: center; justify-content: flex-start; gap: 8px;">
                <label style="margin-bottom: 0;">To whom : </label>
                <span id="targetName" style="font-weight: 600; color: #f97316;"></span>
            </div>
            
            <div class="input-group">
                <label>Enter amount : </label>
                <input type="number" id="useramount" placeholder="1000/-">
            </div>
            <button onclick="proceed()">proceed</button>
            

        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/amount.js"></script>
</body>
</html>
