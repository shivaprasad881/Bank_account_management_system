<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Square Container - Orange Header</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    .modal-box {
      background: white;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
    }
    .modal-box h3 {
      margin-bottom: 15px;
      color: #1e293b;
    }
    .modal-box p {
      margin-bottom: 20px;
      color: #475569;
    }
    .modal-btn {
      padding: 10px 30px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      margin: 0 8px;
    }
    .modal-btn.yes {
      background: #f97316;
      color: white;
    }
    .modal-btn.yes:hover {
      background: #ea580c;
    }
    .modal-btn.no {
      background: #e2e8f0;
      color: #1e293b;
    }
    .modal-btn.no:hover {
      background: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="orange-heading">
      <h1>Login Page</h1>
    </div>

    <div class="content">

      <div class="field">
          <label>Login As</label>
          <select id="usertype" name="userType" style="width: 100%; padding: 10px;">
              <option value="customer" selected>Customer</option>
              <option value="employee">Employee</option>
          </select>
      </div>
 
      <div class="input-group">
        <label for="user_acc">Enter :</label>
        <input type="text" id="user_identity" placeholder="ACC00000001 or 9988776655"> 
      </div>

      <div class="input-group">
        <label for="password">password : </label>
        <input type="text" id="password" name="password"  placeholder="Enter password">
      </div>

      <button type="button" onclick="user_signin()">Login</button>
      
      <a href="signup.html">signup</a>

      <a href="emailvalidator.html" onclick="sessionStorage.setItem('purpose', 'resetpassword')">Forgot-password</a>

    </div>

  </div>

  <!-- Popup Modal -->
  <div class="modal-overlay" id="responseModal">
    <div class="modal-box">
      <h3>Confirmation Required</h3>
      <p id="modalMessage">Do you want to proceed?</p>
      <button class="modal-btn yes" onclick="handleResponse('yes')">Yes</button>
      <button class="modal-btn no" onclick="handleResponse('no')">No</button>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/toast.js"></script>
  <script src="../js/signin.js"></script>
</body>
</html>
