<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Square Container - Orange Header</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="container">

    <div class="orange-heading">
      <h1>Login Page</h1>
    </div>

    <div class="content">

      <div class="field">
          <label>Login As</label>
          <select id="usertype" name="userType" style="width: 100%; padding: 10px;">
              <option value="customer" selected>Customer</option>
              <option value="employee">Employee</option>
          </select>
      </div>
 
      <div class="input-group">
        <label for="user_acc">Enter :</label>
        <input type="text" id="user_identity" placeholder="ACC00000001 or 9988776655"> 
      </div>

      <div class="input-group">
        <label for="password">password : </label>
        <input type="text" id="password" name="password"  placeholder="Enter password">
      </div>

      <button type="button" onclick="user_signin()">Login</button>
      
      <a href="signup.html">signup</a>

      <a href="emailvalidator.html" onclick="sessionStorage.setItem('purpose', 'resetpassword')">Forgot-password</a>

    </div>

  </div>
  <script src="../js/toast.js"></script>
  <script src="../js/signin.js"></script>
</body>
</html>
