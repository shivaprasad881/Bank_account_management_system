<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three Inputs</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="heading">
            <h1>Update-Password</h1>
        </div>
        <div class="content">
            <div class="input-group">
                <label>Current password : </label>
                <input type="text" id="oldpass" placeholder="Enter text">
            </div>
            <div class="input-group">
                <label>New password : </label>
                <input type="text" id="newpass1" placeholder="Enter text">
            </div>
            <div class="input-group">
                <label>Confirm password : </label>
                <input type="text" id="newpass2" placeholder="Enter text">
            </div>
            <button type="button" onclick="updatepass()">Proceed</button>
        </div>
    </div>
    <script src="../js/config.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/updatepassword.js"></script>
</body>
</html>
