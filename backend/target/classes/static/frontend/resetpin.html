<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Form</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="container">
        <div class="heading">
            <h1>Reset pin</h1>
        </div>
        <div class="content">
            <div class="input-group">
                <label>New pin : </label>
                <input type="text" id="new_pin"  placeholder="Enter pin">
            </div>
            <div class="input-group">
                <label>confirm pin : </label>
                <input type="text" id="confirm_pin" placeholder="Enter pin">
            </div>
            <button type="button" onclick="resetpin()" >Reset</button>
        </div>
    </div>

    <script src="../js/toast.js"></script>
    <script src="../js/resetpin.js"></script>

</body>
</html>
